notes: |
  Balogun's 2022-23 Reims loan (21 Ligue 1 goals) was the first real evidence
  of his quality — and it was almost entirely transition football. Arsenal
  never found a way to use him in their possession system and shipped him out.
  His World Cup brace vs Paraguay came in a match with high defensive lines and
  open transitions — exactly the conditions where his profile thrives.
  The question is not whether he can score. It is whether he can score outside
  that one context.
