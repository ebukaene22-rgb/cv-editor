name: Make Episode

# Triggers automatically when a script.json is pushed to any episode folder,
# OR manually via the GitHub Actions UI with a specific slug.
on:
  push:
    paths:
      - "episodes/*/script.json"
  workflow_dispatch:
    inputs:
      episode_slug:
        description: "Episode folder name (e.g. 2026-06-14-nico-williams)"
        required: true

jobs:
  make-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need HEAD~1 for push-triggered slug detection

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: remotion/package-lock.json

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install requests pyyaml elevenlabs yt-dlp

      - name: Install Remotion dependencies
        run: cd remotion && npm ci

      # Remotion needs Chrome. ubuntu-latest ships Chromium; this installs its deps.
      - name: Install Chrome rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            chromium-browser \
            libgbm-dev \
            libasound2-dev \
            fonts-liberation \
            xvfb

      - name: Detect episode slug
        id: slug
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slug=${{ inputs.episode_slug }}" >> $GITHUB_OUTPUT
          else
            # Find the episode folder from the pushed script.json path
            SLUG=$(git diff --name-only HEAD~1 HEAD \
              | grep 'episodes/.*/script.json' \
              | head -1 \
              | cut -d'/' -f2)
            echo "slug=$SLUG" >> $GITHUB_OUTPUT
          fi

      - name: Validate script.json
        run: |
          python .claude/skills/football-scout/scripts/validate.py \
            episodes/${{ steps.slug.outputs.slug }}/script.json

      - name: Generate voiceover (ElevenLabs TTS)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python pipeline/tts.py \
            episodes/${{ steps.slug.outputs.slug }}/script.json

      # Fully automated player image: fetch from Wikipedia, strip background.
      # Skips if a cutout was already committed to assets/players/.
      - name: Fetch & prepare player image
        env:
          REMOVEBG_API_KEY: ${{ secrets.REMOVEBG_API_KEY }}
        run: |
          SLUG=${{ steps.slug.outputs.slug }}
          SCRIPT=episodes/$SLUG/script.json
          PLAYER_SLUG=$(python3 -c "import json; d=json.load(open('$SCRIPT')); print(d['player'].lower().replace(' ','_'))")
          PLAYER_NAME=$(python3 -c "import json; d=json.load(open('$SCRIPT')); print(d['player'])")
          QUERY=$(python3 -c "import json; d=json.load(open('$SCRIPT')); print(d.get('image_query',''))")
          CUTOUT=assets/players/$PLAYER_SLUG.png

          if [ -f "$CUTOUT" ]; then
            echo "Cutout already present: $CUTOUT — skipping fetch."
            exit 0
          fi

          mkdir -p assets/players

          # 1. Fetch raw photo from Wikipedia (pass --query only if set)
          FETCH_ARGS=("$PLAYER_NAME" --out /tmp/raw_player.img)
          if [ -n "$QUERY" ]; then FETCH_ARGS+=(--query "$QUERY"); fi

          if python pipeline/fetch_player_image.py "${FETCH_ARGS[@]}"; then
            # 2. Strip background via remove.bg -> transparent PNG
            if python pipeline/removebg.py /tmp/raw_player.img "$CUTOUT"; then
              echo "Cutout ready: $CUTOUT"
            else
              echo "remove.bg failed — using raw photo as fallback."
              cp /tmp/raw_player.img "$CUTOUT"
            fi
          else
            echo "No image found for $PLAYER_NAME — video will use placeholder."
          fi

      # V6: fetch 1-3s evidence clips (one per axis exhibit) from YouTube.
      # Uses yt-dlp search — no direct URL required. Clips are cut and scaled to 9:16.
      # If yt-dlp fails for any exhibit, that exhibit falls back to the procedural TacticalBoard.
      - name: Fetch evidence clips
        run: |
          SLUG=${{ steps.slug.outputs.slug }}
          CLIPS_JSON="episodes/$SLUG/clips.json"
          if [ ! -f "$CLIPS_JSON" ]; then
            echo "No clips.json — skipping clip fetch (all exhibits use TacticalBoard)"
            exit 0
          fi
          mkdir -p remotion/public/clips
          python pipeline/fetch_clips.py "$CLIPS_JSON" --out remotion/public/clips

      - name: Render episode video (Remotion)
        run: |
          SLUG=${{ steps.slug.outputs.slug }}

          # Stage voiceover so Remotion can load it via staticFile("vo.mp3")
          cp episodes/$SLUG/vo.mp3 remotion/public/vo.mp3

          # Stage player cutout if one exists, and inject its key into props
          PLAYER=$(python3 -c "import json; d=json.load(open('episodes/$SLUG/script.json')); print(d['player'].lower().replace(' ','_'))")
          PLAYER_IMG="assets/players/${PLAYER}.png"
          PROPS=$(cat episodes/$SLUG/script.json)
          if [ -f "$PLAYER_IMG" ]; then
            mkdir -p remotion/public/players
            cp "$PLAYER_IMG" remotion/public/players/${PLAYER}.png
            PROPS=$(python3 -c "import json,sys; d=json.loads(sys.argv[1]); d['player_image_key']='players/${PLAYER}.png'; print(json.dumps(d))" "$PROPS")
          fi

          # Inject clip specs for successfully fetched evidence clips (V6)
          CLIPS_JSON="episodes/$SLUG/clips.json"
          if [ -f "$CLIPS_JSON" ]; then
            CLIPS_PROPS=$(python3 pipeline/clips_to_props.py "$CLIPS_JSON" remotion/public/clips)
            if [ -n "$CLIPS_PROPS" ] && [ "$CLIPS_PROPS" != "{}" ]; then
              PROPS=$(python3 -c "import json,sys; d=json.loads(sys.argv[1]); d['clips']=json.loads(sys.argv[2]); print(json.dumps(d))" "$PROPS" "$CLIPS_PROPS")
              echo "Clips injected: $CLIPS_PROPS"
            fi
          fi

          cd remotion
          # swangle = software renderer, no GPU needed in CI
          npx remotion render src/index.ts CaseFile \
            ../episodes/$SLUG/episode.mp4 \
            --props="$PROPS" \
            --gl=swangle \
            --log=verbose

      - name: Generate thumbnail (remove.bg + Remotion)
        env:
          REMOVEBG_API_KEY: ${{ secrets.REMOVEBG_API_KEY }}
        run: |
          SLUG=${{ steps.slug.outputs.slug }}
          PLAYER=$(python3 -c "import json; d=json.load(open('episodes/$SLUG/script.json')); print(d['player'].lower().replace(' ','_'))")
          CONFIG="thumbnails/variants/${PLAYER}-*.yaml"
          # Use first matching config, or fall back to generating without cutout
          MATCH=$(ls $CONFIG 2>/dev/null | head -1)
          if [ -n "$MATCH" ]; then
            python thumbnails/generate_thumbnail.py "$MATCH"
          else
            echo "No thumbnail config found for $PLAYER — skipping thumbnail render"
          fi

      - name: Upload episode artifacts
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ steps.slug.outputs.slug }}
          path: |
            episodes/${{ steps.slug.outputs.slug }}/episode.mp4
            episodes/${{ steps.slug.outputs.slug }}/vo.mp3
            thumbnails/output/*_with_cutout.png
            thumbnails/output/*_no_cutout.png
          retention-days: 30

      - name: Summary
        run: |
          echo "## Episode ready for review" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Slug:** \`${{ steps.slug.outputs.slug }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the mp4 + thumbnails from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          echo "Review, then publish manually via YouTube Studio / TikTok." >> $GITHUB_STEP_SUMMARY
