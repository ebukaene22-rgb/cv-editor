# Thumbnail config schema — one file per episode thumbnail.
# Feed to pipeline/generate_thumbnail.py → renders via Remotion ThumbnailComposition.

# --- REQUIRED ---
player_name: "PEDRI"            # Uppercase. Fills top of frame.
variant: fraud_watch            # fraud_watch | system_product | outlier | transfer_trap

# --- SCORES (required) ---
instinct: 7
iq: 6
gravity: 5
transferability: 42             # integer 0-100

# --- VARIANT-SPECIFIC (optional, variant determines defaults) ---
verdict_label: "FRAUD WATCH?"   # Override the stamp text if needed
verdict_color: red              # red | green. red=negative, green=positive

# --- TRANSFER TRAP only ---
# transfer_club: "ARSENAL"      # Shown as "[PLAYER] TO [CLUB]?"

# --- OPTIONAL OVERRIDES ---
# subtitle: "La Liga 2025-26"
# collapse_risk: "HIGH"         # Shows warning label (system_product variant)
# stamp_angle: -15              # Degrees. Default -15.
